name: Sincronizza ClasseViva

on:
  schedule:
    # Gira ogni 2 ore dalle 7:00 alle 21:00 (ora italiana)
    - cron: '0 6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Esegui sync.py
        env:
          CV_USER: ${{ secrets.CV_USER }}
          CV_PASS: ${{ secrets.CV_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync.py
